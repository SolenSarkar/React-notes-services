services:
  - type: web
    name: notes-service-backend
    runtime: node

    rootDir: server

    buildCommand: npm install
    startCommand: npm start

    healthCheckPath: /

    envVars:
      - key: PORT
        value: 10000

      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: CLIENT_URL
        sync: false